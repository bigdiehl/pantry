{% extends "base.html" %}

{% block title %}Shopping List{% endblock %}

{% block content %}
<div class="page">
    <div class="page-header">
        <div>
            <h1>Shopping list</h1>
            <div class="meta" id="remainingCount"></div>
        </div>
        <div class="dropdown">
            <button class="icon-btn" data-bs-toggle="dropdown" aria-label="List options">
                <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" onclick="uncheckAll()">Uncheck everything</button></li>
                <li><button class="dropdown-item" onclick="restoreRemoved()">Restore removed items</button></li>
                <li><button class="dropdown-item" onclick="clearCustom()">Clear my added items</button></li>
            </ul>
        </div>
    </div>

    <div class="chip-row" aria-label="Selected recipes">
        {% for recipe in recipes %}
        <span class="chip">{{ recipe.name }}<button type="button" class="remove-recipe" data-slug="{{ recipe.slug }}" aria-label="Remove {{ recipe.name }}">&times;</button></span>
        {% endfor %}
        <a class="chip chip-add" href="{{ url_for('recipes_list') }}">+ {{ 'Recipes' if recipes else 'Pick recipes' }}</a>
    </div>

    <form class="add-bar" onsubmit="addCustomItem(event)">
        <input type="text" id="newItem" class="form-control" placeholder="Add item, e.g. milk, 1 gal" autocomplete="off" enterkeyhint="done">
        <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="list-tools" id="vendorBar" hidden>
        <span class="text-muted small">Store</span>
        <select id="vendorFilter" class="form-select form-select-sm">
            <option value="">All stores</option>
        </select>
    </div>

    <div id="list"></div>

    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemModalName"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2" id="itemModalQty"></p>
                    <p class="mb-2" id="itemModalVendor" hidden></p>
                    <div id="itemModalSourcesWrap">
                        <div class="text-muted small mb-1">From</div>
                        <ul id="itemModalSources" class="mb-0 ps-3"></ul>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" id="itemModalRemove">Remove from list</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// { main: {Category: [{name, quantity, vendor, sources}]}, secondary: {...} }
const SERVER_ITEMS = {{ shopping_items | tojson }};
const STORAGE_KEY = 'shopping_list_table_state';
// Changes each time the weekly plan runs; a new plan starts a fresh checklist.
const WEEK_ID = {{ week_id | tojson }};

// Client-only state layered over the server list. Real ingredients are keyed
// "Category::name"; custom items live in their own array.
let checkedKeys = new Set();
let dismissedKeys = new Set();
let customItems = [];
let vendorFilter = '';
let itemIndex = {};

const CHECK_SVG = '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const INFO_SVG = '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s) {
            checkedKeys = new Set(s.checked || []);
            dismissedKeys = new Set(s.dismissed || []);
            customItems = s.custom || [];
            if (WEEK_ID && s.week !== WEEK_ID) {
                checkedKeys.clear();
                dismissedKeys.clear();
                customItems.forEach(i => { i.checked = false; });
            }
        }
    } catch (e) { /* start fresh */ }
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        checked: [...checkedKeys], dismissed: [...dismissedKeys], custom: customItems, week: WEEK_ID
    }));
}

// Visible items of one server section, grouped by category, minus dismissed/filtered.
function sectionItems(section) {
    const out = [];
    const groups = SERVER_ITEMS[section] || {};
    for (const category of Object.keys(groups).sort()) {
        for (const item of groups[category]) {
            const key = `${category}::${item.name}`;
            if (dismissedKeys.has(key)) continue;
            if (vendorFilter && (item.vendor || '') !== vendorFilter) continue;
            itemIndex[key] = { ...item, key, category };
            out.push({ key, name: item.name, quantity: item.quantity, category, checked: checkedKeys.has(key) });
        }
    }
    return out;
}

function customList() {
    return customItems.map((item, i) => {
        const key = `custom-${i}`;
        itemIndex[key] = { name: item.name, quantity: item.quantity, key, custom: true };
        return { key, name: item.name, quantity: item.quantity, category: 'My items', checked: !!item.checked };
    });
}

function rowHtml(item) {
    return `
        <div class="item${item.checked ? ' checked' : ''}" data-key="${esc(item.key)}">
            <span class="check">${CHECK_SVG}</span>
            <span class="item-body">
                <span class="item-name">${esc(item.name)}</span>
                <span class="item-qty">${esc(item.quantity || '')}</span>
            </span>
            <button class="icon-btn info-btn" data-key="${esc(item.key)}" aria-label="Details">${INFO_SVG}</button>
        </div>`;
}

function groupHtml(label, items) {
    if (!items.length) return '';
    return `<div class="section-label">${esc(label)}</div><div class="panel">${items.map(rowHtml).join('')}</div>`;
}

function render() {
    itemIndex = {};
    const custom = customList();
    const main = sectionItems('main');
    const secondary = sectionItems('secondary');

    const toGet = [...custom, ...main].filter(i => !i.checked);
    const inCart = [...custom, ...main].filter(i => i.checked);

    let html = '';
    if (!custom.length && !main.length && !secondary.length) {
        html = `<div class="panel mt-3"><div class="empty-note">Nothing on the list yet.<br>Pick some recipes or add an item above.</div></div>`;
    }

    html += groupHtml('My items', toGet.filter(i => i.key.startsWith('custom-')));
    const byCategory = {};
    toGet.filter(i => !i.key.startsWith('custom-')).forEach(i => (byCategory[i.category] ||= []).push(i));
    for (const cat of Object.keys(byCategory)) html += groupHtml(cat, byCategory[cat]);

    if (main.length + custom.length && !toGet.length) {
        html += `<div class="panel mt-3"><div class="empty-note">All done. Everything is in the cart.</div></div>`;
    }

    if (inCart.length) {
        html += `<details class="collapsible" id="cartGroup"${sessionStorage.getItem('cartOpen') === '1' ? ' open' : ''}>
            <summary class="section-label">${CHEV_SVG} In cart (${inCart.length})</summary>
            <div class="panel">${inCart.map(rowHtml).join('')}</div></details>`;
    }

    if (secondary.length) {
        const have = secondary.filter(i => !i.checked).length;
        html += `<details class="collapsible" id="haveGroup"${sessionStorage.getItem('haveOpen') === '1' ? ' open' : ''}>
            <summary class="section-label">${CHEV_SVG} Probably have (${have})</summary>
            <div class="panel">${secondary.map(rowHtml).join('')}</div></details>`;
    }

    document.getElementById('list').innerHTML = html;
    const total = toGet.length;
    document.getElementById('remainingCount').textContent =
        (main.length + custom.length) ? (total ? `${total} to get` : 'All done') : '';

    for (const [id, keyName] of [['cartGroup', 'cartOpen'], ['haveGroup', 'haveOpen']]) {
        const el = document.getElementById(id);
        if (el) el.addEventListener('toggle', () => sessionStorage.setItem(keyName, el.open ? '1' : '0'));
    }
}

function toggleItem(key) {
    if (key.startsWith('custom-')) {
        const item = customItems[parseInt(key.slice(7), 10)];
        item.checked = !item.checked;
    } else if (checkedKeys.has(key)) {
        checkedKeys.delete(key);
    } else {
        checkedKeys.add(key);
    }
    saveState();
    render();
}

function removeItem(key) {
    if (key.startsWith('custom-')) {
        customItems.splice(parseInt(key.slice(7), 10), 1);
    } else {
        dismissedKeys.add(key);
        checkedKeys.delete(key);
    }
    saveState();
    render();
}

function showDetail(key) {
    const item = itemIndex[key];
    if (!item) return;
    document.getElementById('itemModalName').textContent = item.name;
    document.getElementById('itemModalQty').textContent = item.quantity ? `Quantity: ${item.quantity}` : 'No quantity given';

    const vendor = document.getElementById('itemModalVendor');
    vendor.hidden = !item.vendor;
    if (item.vendor) vendor.textContent = `Store: ${item.vendor}`;

    const wrap = document.getElementById('itemModalSourcesWrap');
    wrap.hidden = !!item.custom;
    document.getElementById('itemModalSources').innerHTML = (item.sources || []).map(s =>
        `<li><a href="/recipes_list?recipe=${encodeURIComponent(s.name)}">${esc(s.name)}</a></li>`).join('')
        || '<li class="text-muted">Not from a recipe</li>';

    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal'));
    document.getElementById('itemModalRemove').onclick = () => { removeItem(key); modal.hide(); };
    modal.show();
}

// "milk, 1 gal" -> name "milk", quantity "1 gal"
function addCustomItem(e) {
    e.preventDefault();
    const input = document.getElementById('newItem');
    const raw = input.value.trim();
    if (!raw) return;
    const [name, ...rest] = raw.split(',');
    customItems.push({ name: name.trim(), quantity: rest.join(',').trim(), checked: false });
    saveState();
    render();
    input.value = '';
    input.focus();
}

function uncheckAll() {
    checkedKeys.clear();
    customItems.forEach(i => { i.checked = false; });
    saveState();
    render();
}

function restoreRemoved() {
    dismissedKeys.clear();
    saveState();
    render();
}

function clearCustom() {
    if (customItems.length && !confirm('Clear all items you added by hand?')) return;
    customItems = [];
    saveState();
    render();
}

function initVendorFilter() {
    const vendors = new Set();
    for (const section of ['main', 'secondary']) {
        for (const items of Object.values(SERVER_ITEMS[section] || {})) {
            items.forEach(i => i.vendor && vendors.add(i.vendor));
        }
    }
    if (!vendors.size) return;
    const select = document.getElementById('vendorFilter');
    [...vendors].sort().forEach(v => select.add(new Option(v, v)));
    document.getElementById('vendorBar').hidden = false;
    select.addEventListener('change', () => { vendorFilter = select.value; render(); });
}

document.getElementById('list').addEventListener('click', (e) => {
    const info = e.target.closest('.info-btn');
    if (info) { showDetail(info.dataset.key); return; }
    const row = e.target.closest('.item');
    if (row) toggleItem(row.dataset.key);
});

document.querySelectorAll('.remove-recipe').forEach(btn => {
    btn.addEventListener('click', () => {
        fetch(`/deselect/${btn.dataset.slug}`, { method: 'POST' })
            .then(r => r.json())
            .then(d => d.success ? location.reload() : alert('Could not remove recipe.'))
            .catch(() => alert('Could not remove recipe (offline?).'));
    });
});

loadState();
saveState();
initVendorFilter();
render();
</script>
{% endblock %}
