{% extends "base.html" %}

{% block title %}Recipes{% endblock %}

{% block content %}
<div class="page page-wide">
    <div class="recipes-layout">
        <div>
            <div class="page-header">
                <h1>Recipes</h1>
                <span class="meta" id="selectedCount"></span>
            </div>
            <input type="search" id="recipeSearch" class="search-input" placeholder="Search recipes" autocomplete="off">
            <div class="recipes-toolbar">
                <div class="segmented" id="statusToggle">
                    <button type="button" data-value="saved" class="active">Saved</button>
                    <button type="button" data-value="archived">Archived</button>
                </div>
                <div class="segmented" id="groupToggle">
                    <button type="button" data-value="category" class="active">Type</button>
                    <button type="button" data-value="meal">Meal</button>
                </div>
            </div>
            <div id="recipeGroups"></div>
        </div>

        <aside class="recipe-detail" id="recipeDetail" aria-label="Recipe">
            <div class="recipe-detail-bar">
                <button class="icon-btn back-btn" id="detailBack" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="recipe-detail-title" id="detailTitle">Recipe</div>
                <button class="pill-btn" id="detailToggle" hidden></button>
            </div>
            <div class="recipe-detail-body">
                <div class="markdown-content" id="detailContent">
                    <p class="recipe-detail-placeholder">Pick a recipe to read it here.</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<script id="recipesData" type="application/json">{{ recipes | tojson }}</script>
<script id="archivedRecipesData" type="application/json">{{ archived_recipes | tojson }}</script>
{% endblock %}

{% block scripts %}
<script src="{{ asset('scripts/recipes_list.js') }}"></script>
{% endblock %}
