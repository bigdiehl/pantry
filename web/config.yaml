app:
  # Recipe data lives in the separate diehl_recipes repo. Relative to web/.
  # RECIPES_DATA_DIR env var overrides.
  data_dir: ../../diehl_recipes
  recipes_dir: recipes/saved
  pending_dir: recipes/pending
  archived_dir: recipes/archived
  state_file: instance/state.json
  output_dir: ../output

email:
  # Set GMAIL_APP_PASSWORD environment variable with your Gmail app password
  # See: https://support.google.com/accounts/answer/185833
  sender: ""  # Your Gmail address - set via GMAIL_SENDER env var
  smtp_server: smtp.gmail.com
  smtp_port: 587
