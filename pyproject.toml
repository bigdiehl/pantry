[project]
name = "pantry"
version = "0.1.0"
description = "Recipe browser, shopping list generator, and weekly meal planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "bs4>=0.0.2",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "google-genai>=1.70.0",
    "markdown>=3.10.2",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pint>=0.25.3",
    "pydantic>=2.12.5",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "readability-lxml>=0.8.4.1",
    "ruamel-yaml>=0.19.1",
    "termcolor>=3.3.0",
    "weasyprint>=68.1",
    "werkzeug>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recipe_core"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "snakeviz>=2.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore:.*CallSpec2.*"]
